# Reusable workflow: lint -> test -> build & push a Docker image.
# Any Node.js repo can call it with `uses: <owner>/<repo>/.github/workflows/reusable-node-build.yml@main`.
name: Reusable Node build

on:
  workflow_call:
    inputs:
      image-name:
        description: Docker Hub repository, e.g. joneabraham/todo-service
        required: true
        type: string
      node-version:
        required: false
        type: string
        default: "20"
      dockerhub-username:
        required: false
        type: string
        default: ""
      push:
        description: Push the image (false for pull requests)
        required: false
        type: boolean
        default: true
    secrets:
      DOCKERHUB_TOKEN:
        required: false
    outputs:
      image-tag:
        description: Immutable tag (short SHA) that was built
        value: ${{ jobs.build.outputs.image-tag }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
      - run: npm ci
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - if: inputs.push
        uses: docker/login-action@v3
        with:
          username: ${{ inputs.dockerhub-username }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ inputs.push }}
          build-args: APP_VERSION=${{ steps.meta.outputs.tag }}
          tags: |
            ${{ inputs.image-name }}:${{ steps.meta.outputs.tag }}
            ${{ inputs.image-name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
